<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070b" />

    <!-- Theme before paint: no flash on reload -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("portfolio-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            dark ? "#06070b" : "#f6f7fb",
          );
        } catch (e) {}
      })();
    </script>

    <title>Mohammad Asif — Backend / Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Mohammad Asif — backend and full-stack developer building REST APIs and web apps with NestJS, TypeScript, Node.js, PostgreSQL and React."
    />
    <meta name="author" content="Mohammad Asif" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohammad Asif — Backend / Full Stack Developer" />
    <meta
      property="og:description"
      content="Backend and full-stack developer building REST APIs and web apps with NestJS, TypeScript, Node.js and React."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink text-slate-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
